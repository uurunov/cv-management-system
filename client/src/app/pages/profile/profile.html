<div class="h-[inherit] flex flex-col items-center justify-center gap-4">
  <p-card
    class="pt-6 pb-2"
    [style]="{
      width: '25rem',
      overflow: 'hidden',
      display: 'flex',
      alignItems: 'center',
    }"
  >
    <ng-template #header>
      <p-avatar icon="pi pi-user" size="xlarge" shape="circle" />
    </ng-template>
    <ng-template #title> {{ authService.currentUser()?.email }} </ng-template>
    <ng-template #subtitle>
      <div class="card flex items-center gap-2 flex-wrap">
        @for (role of authService.currentUser()?.roles; track role) {
          <p-chip [label]="role" />
        }
      </div>
    </ng-template>
    <ng-template #footer>
      <div class="flex gap-4">
        <p-button
          label="Add to Salesforce CRM"
          severity="secondary"
          class="w-full"
          [outlined]="true"
          styleClass="w-full"
          (click)="this.sfDialog.set(true)"
        />
      </div>
    </ng-template>
  </p-card>

  <p-button label="Create support ticket" link (click)="this.spTicketDialog.set(true)" />

  <p-dialog
    header="Add your details to our CRM"
    [(visible)]="sfDialog"
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false"
  >
    <form [formRoot]="sforceForm" pFocusTrap class="flex flex-col items-center gap-3">
      <div class="w-3/4 flex flex-col gap-1">
        <label for="firstName">First name</label>
        <input
          pInputText
          id="firstName"
          aria-describedby="firstName-help"
          [formField]="sforceForm.firstName"
          pSize="small"
        />
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <label for="lastName">Last name</label>
        <input
          pInputText
          id="lastName"
          aria-describedby="lastName-help"
          [formField]="sforceForm.lastName"
          pSize="small"
        />
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <label for="company">Company</label>
        <input
          pInputText
          id="company"
          aria-describedby="company-help"
          [formField]="sforceForm.company"
          pSize="small"
        />
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <label for="phone">Phone</label>
        <p-inputgroup>
          <p-inputgroup-addon [style]="{ padding: '6px 10px' }">+</p-inputgroup-addon>
          <input
            pInputText
            id="phone"
            pKeyFilter="num"
            aria-describedby="phone-help"
            [formField]="sforceForm.phone"
            pSize="small"
          />
        </p-inputgroup>
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <label for="jobTitle">Job title</label>
        <input
          pInputText
          id="jobTitle"
          aria-describedby="jobTitle-help"
          [formField]="sforceForm.jobTitle"
          pSize="small"
        />
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <label for="description">Description</label>
        <input
          pInputText
          id="description"
          aria-describedby="description-help"
          [formField]="sforceForm.description"
          pSize="small"
        />
      </div>

      <div class="flex justify-center gap-2 mt-4">
        <p-button label="Cancel" severity="secondary" (click)="this.sfDialog.set(false)" />
        <p-button label="Send to Salesforce" type="submit" />
      </div>
    </form>
  </p-dialog>

  <p-dialog
    header="Submit your support ticket"
    [(visible)]="spTicketDialog"
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false"
  >
    <form [formRoot]="spTicketForm" pFocusTrap class="flex flex-col items-center gap-3">
      <div class="w-3/4 flex flex-col gap-1">
        <label for="summary">Summary</label>
        <input
          pInputText
          id="summary"
          aria-describedby="summary-help"
          [formField]="spTicketForm.summary"
          pSize="small"
        />
      </div>

      <div class="w-3/4 flex flex-col gap-1">
        <h6 class="text-sm">Select priority</h6>
        <p-selectbutton
          id="role"
          [options]="priorityOptions()"
          [formField]="spTicketForm.priority"
          fluid
          size="small"
        />
      </div>

      <div class="flex justify-center gap-2 mt-4">
        <p-button label="Cancel" severity="secondary" (click)="this.spTicketDialog.set(false)" />
        <p-button label="Submit ticket" type="submit" />
      </div>
    </form>
  </p-dialog>
</div>
